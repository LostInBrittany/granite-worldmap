<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>granite-worldmap demo</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #fafafa;
        font-family: system-ui, sans-serif;
      }
      granite-worldmap {
        --granite-worldmap-height: 70vh;
        --granite-worldmap-border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>granite-worldmap</h1>
    <p>Open the console and click a marker to see the dispatched event.</p>

    <div id="demo"></div>

    <script type="module">
      import { html, render } from 'lit';
      import '../granite-worldmap.js';

      const locations = [
        // Rich entry: hover title, multi-event popup list, high intensity.
        {
          lat: 41.3874,
          lng: 2.1686,
          title: 'Barcelona, Spain',
          intensity: 5,
          entries: [
            { label: 'DevBCN', meta: '2025', url: 'https://noti.st' },
            { label: 'DevBCN', meta: '2024', url: 'https://noti.st' },
            { label: 'BCN JUG', meta: '2024', url: 'https://noti.st' },
          ],
        },
        {
          lat: 48.8566,
          lng: 2.3522,
          title: 'Paris, France',
          intensity: 3,
          entries: [
            { label: 'Devoxx France', meta: '2025', url: 'https://noti.st' },
            { label: 'Paris Web', meta: '2023' },
          ],
        },
        // Long list: more than popup-max-entries (10) rows → the popup scrolls.
        {
          lat: 45.5019,
          lng: -73.5674,
          title: 'Montréal, Canada',
          intensity: 5,
          entries: [
            { label: 'MoodleMoot Canada', meta: '2026', url: 'https://noti.st' },
            { label: 'MTL_code', meta: '2026', url: 'https://noti.st' },
            { label: 'Montreal Digital Summit', meta: '2025', url: 'https://noti.st' },
            { label: 'CNCF Montreal Meetup', meta: '2024', url: 'https://noti.st' },
            { label: 'Confoo', meta: '2024', url: 'https://noti.st' },
            { label: 'Confoo', meta: '2023', url: 'https://noti.st' },
            { label: 'Ville de Montréal', meta: '2020', url: 'https://noti.st' },
            { label: '#trumontreal', meta: '2017', url: 'https://noti.st' },
            { label: 'DevTeach Montreal', meta: '2017', url: 'https://noti.st' },
            { label: 'S2LQ', meta: '2016', url: 'https://noti.st' },
            { label: 'DevTeach Montreal', meta: '2016', url: 'https://noti.st' },
            { label: 'MSDEVMTL', meta: '2016', url: 'https://noti.st' },
            { label: 'Collège Notre-Dame', meta: '2016', url: 'https://noti.st' },
            { label: 'Montreal.rb', meta: '2015', url: 'https://noti.st' },
            { label: 'JavaScript Open Day', meta: '2015', url: 'https://noti.st' },
          ],
        },
        // Backward-compatible simple entries (unchanged behavior).
        { name: 'Tokyo', lat: 35.6762, lng: 139.6503 },
        { name: 'Boston', lat: 42.3601, lng: -71.0589 },
        { name: 'Sydney', lat: -33.8688, lng: 151.2093 },
        { name: 'Cape Town', lat: -33.9249, lng: 18.4241 },
        { name: 'São Paulo', lat: -23.5558, lng: -46.6396 },
        { name: 'Bengaluru', lat: 12.9716, lng: 77.5946 },
      ];

      render(
        html`
          <granite-worldmap
            .locations=${locations}
            @granite-worldmap-marker-click=${e =>
              console.log('marker click:', e.detail)}
          ></granite-worldmap>
        `,
        document.querySelector('#demo'),
      );
    </script>
  </body>
</html>
